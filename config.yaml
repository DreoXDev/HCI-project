project:
  title: "Deliveroo VS Glovo - Analisi Trasversale di Usabilita"
  system_1: "Deliveroo"
  system_2: "Glovo"
  system_1_id: "deliveroo"
  system_2_id: "glovo"
  academic_year: "20XX/20XX"

paths:
  formbricks_raw_dir: "data/formbricks_raw"
  processed_dir: "data/processed"
  raw_dir: "data/raw"
  outputs_dir: "outputs"
  questionnaire_raw: "data/formbricks_raw/questionnaire/formbricks_questionnaire_demo_12_users.csv"
  heuristics_raw: "data/formbricks_raw/heuristics_discovery/formbricks_heuristics_discovery_demo_6_experts.csv"
  heuristics_ratings: "data/formbricks_raw/heuristics_ratings/formbricks_heuristics_ratings_demo_6_experts.csv"
  user_tests_raw: "data/formbricks_raw/user_tests/user_tests.csv"
  users_time: "data/raw/users_time.csv"
  heuristics_system_1: "data/raw/heuristics_deliveroo.csv"
  heuristics_system_2: "data/raw/heuristics_glovo.csv"
  questionnaire_system_1: "data/raw/questionnaire_deliveroo.csv"
  questionnaire_system_2: "data/raw/questionnaire_glovo.csv"
  output_figures: "outputs/figures"
  output_tables: "outputs/tables"
  output_tables_md: "outputs/tables/markdown"
  output_text: "outputs/texts/snippets"

users_time:
  enabled: true
  input_path: "data/raw/users_time.csv"
  required_columns:
    - user_id
    - app
    - task_id
    - task_name
    - completion_time_sec
    - success
    - errors_count
    - help_requests
  tasks:
    - id: T01
      name: "Ricerca ristorante"
      oet_seconds: 45
    - id: T02
      name: "Aggiunta prodotto al carrello"
      oet_seconds: 90
    - id: T03
      name: "Modifica carrello"
      oet_seconds: 60
    - id: T04
      name: "Checkout"
      oet_seconds: 90
    - id: T05
      name: "Tracking ordine"
      oet_seconds: 60

visualization:
  style: both
  export_svg: true
  export_png: true
  dpi: 220
  transparent_background: true
  fonts:
    preferred: Sora
    weight: 600
    local_files:
      - "assets/fonts/Sora-wght.ttf"
      - "assets/fonts/Sora-Bold.ttf"
      - "assets/fonts/Inter-opsz-wght.ttf"
      - "assets/fonts/Inter-Italic-opsz-wght.ttf"
      - "assets/fonts/BebasNeue-Regular.ttf"
    fallback: DejaVu Sans
  colors:
    deliveroo: "#00CCBC"
    glovo: "#FFC244"
    neutral: "#1F2937"
    muted: "#6B7280"
    grid: "#E5E7EB"
  presentation:
    enabled: true
    glow: true
    annotations: true

style:
  system_1_color: "#00C7C7"
  system_1_dark: "#07191B"
  system_2_color: "#FFD300"
  system_2_dark: "#1E1600"
  background: "#050505"
  card_background: "#141418"
  text: "#FFFFFF"
  secondary_text: "#D6D6D6"

analysis:
  task_success_completed: "C"
  task_success_helped: "A"
  task_failed: "F"
  ueq_scale_min: 1
  ueq_scale_max: 7
  nps_min: 0
  nps_max: 10
  round_decimals: 2
  generate_text_snippets: true
  generate_slide_assets: false

final_score:
  enabled: true
  weights:
    effectiveness: 0.25
    efficiency: 0.20
    ueq: 0.30
    nps: 0.15
    heuristic_penalty: 0.10

questionnaire:
  demographic_rows:
    - "genere"
    - "eta"
    - "situazione lavorativa"
    - "istruzione"
    - "familiarita delivery"
    - "familiarita con app di delivery"
    - "familiarita"
    - "preferred_app"
    - "frequency_usage"

formbricks:
  raw_dir: "data/formbricks_raw"
  use_only_finished: true
  finished_column_aliases:
    - "Finished"
    - "Completato"
    - "completed"
  schema_dir: "src/schemas"

  tags:
    demographic: "DEMOGRAPHIC"
    ueq: "UEQ"
    nps: "NPS"
    heuristic: "HEURISTIC"

  questionnaire:
    schema_path: "src/schemas/questionnaire_schema.yaml"
    export_path: "data/formbricks_raw/questionnaire/formbricks_questionnaire_demo_12_users.csv"
    output_system_1: "data/raw/questionnaire_deliveroo.csv"
    output_system_2: "data/raw/questionnaire_glovo.csv"

    metadata_columns:
      - "No."
      - "Response ID"
      - "Timestamp"
      - "Finished"
      - "Survey ID"
      - "Formbricks ID (internal)"
      - "User ID"
      - "Tags"
      - "url"
      - "country"
      - "userAgent - os"
      - "userAgent - device"
      - "userAgent - browser"

    demographic_map:
      genere: "1. Genere"
      eta: "2. Eta"
      situazione lavorativa: "3. Professione"
      familiarita delivery: "4. Familiarita con app di delivery di cibo."

    system_1_column_contains: "Deliveroo"
    system_2_column_contains: "Glovo"

    nps_system_1: ""
    nps_system_2: ""

    ueq_items:
      - "fastidioso-piacevole"
      - "incomprensibile-comprensibile"
      - "creativo-privo di fantasia"
      - "facile da apprendere-difficile da apprendere"
      - "di grande valore-di poco valore"
      - "noioso-appassionante"
      - "non interessante-interessante"
      - "imprevedibile-prevedibile"
      - "veloce-lento"
      - "originale-convenzionale"
      - "ostruttivo-di supporto"
      - "buono-scarso"
      - "complicato-facile"
      - "repellente-attraente"
      - "usuale-moderno"
      - "sgradevole-gradevole"
      - "sicuro-insicuro"
      - "attivante-soporifero"
      - "conforme alle aspettative-non conforme alle aspettative"
      - "inefficiente-efficiente"
      - "chiaro-confuso"
      - "non pragmatico-pragmatico"
      - "ordinato-sovraccarico"
      - "invitante-non invitante"
      - "congeniale-ostile"
      - "conservativo-innovativo"

