    Perspicuity: "Apprendibilità"
    Efficiency: "Efficienza"
    Dependability: "Controllabilità"
    Stimulation: "Stimolazione"
    Novelty: "Originalità"
  heatmap_short_labels:
    Attrattività: "Attr."
    Apprendibilità: "Appr."
    Efficienza: "Eff."
    Controllabilità: "Contr."
    Stimolazione: "Stim."
    Originalità: "Orig."
  sanity_checks:
    - "Non usare raw mean 1..7 come risultato ufficiale UEQ."
