deck:
  output: outputs/slides/final_report.pptx
  template: slides/templates/Deliveroo_vs_Glovo_clean_python_ready_template.pptx

final_delivery: true
include_asset_manifest: false
include_empty_appendices: false
include_debug_footnotes: false

appendices:
  include_empty_placeholders: false
  include_task_deck_as_images: false
  include_questionnaire_exports: false
  include_asset_manifest: false

problem_tables:
  split_by_app: true
  sort_by: [priority_band, severity_mean_desc, source_count_desc, problem_id]
  include_description: true
  max_rows_per_slide: 5

heuristics:
  problem_evaluator_matrix:
    # presence: mostra solo se il valutatore ha trovato/valutato il problema,
    #           colorando le celle con il colore dell'app.
    # severity: mostra la severita 0-4 assegnata dai valutatori.
    mode: presence

metadata:
  project_title: "Deliveroo vs Glovo"
  subtitle: "Analisi trasversale di usabilità"
  authors: "Gruppo HCI"
  date: "Anno accademico 2025/2026"
  data_status_label: "Dati finali"

auto_slides:
  enabled: true
  # modalità che segue l'ordine del PDF di riferimento:
  # introduzione, valutazione euristica, user test, questionario,
  # conclusioni e appendici. I testi statici sono in
  # slides/content/reference_static_texts.md.
  mode: reference_order
  reference_texts: slides/content/reference_static_texts.md
  figure_style: dark
  include_figures: true
  include_tables: true
  include_text_findings: true
  include_text_slides: true
  include_slide_pack_text: false
  include_sources: false
  include_asset_manifest: false
  include_empty_appendices: false
  include_final_appendix: false
  questionnaire_items: all
  final_delivery: true
  user_task_deck_source: slides/assets/user_task_deck/user_task_deck.pptx
  user_task_deck_pdf: slides/assets/user_task_deck/user_task_deck.pdf
  user_task_deck_render_dir: outputs/slide_assets/imported_user_task_deck
  table_rows_per_slide: 10
  task_count: 3
  appendix_assets_root: slides/assets/appendices
  problem_tables:
    max_rows_per_slide: 5
  # Lasciare vuoto per generare tutte le slide possibili dagli asset esistenti.
  # Impostare un numero se serve produrre solo un sottoinsieme per revisione rapida.
  max_slides:
  exclude: []

slides:
  - template_id: cover
    fields:
      PROJECT_TITLE: "Deliveroo vs Glovo"
      PROJECT_SUBTITLE: "Analisi trasversale di usabilità"
      AUTHORS: "Gruppo HCI"
      YEAR/DATE: "Anno accademico 2025/2026"

  - template_id: section_divider
    fields:
      SECTION_NAME: "Questionario UEQ e NPS"

  - template_id: graph_full
    fields:
      GRAPH_TITLE: "Distribuzione dei punteggi UEQ"
      INSIGHT_TEXT: "Le scale UEQ evidenziano differenze utili per leggere efficacia percepita, apprendibilita e attrattivita."
    images:
      GRAPH_MAIN: outputs/figures/dark/questionnaire/ueq_scales.png

  - template_id: comparison
    fields:
      COMPARISON_TITLE: "Confronto euristiche"
      SUMMARY_TEXT: "Il confronto visualizza la distribuzione delle euristiche violate e le categorie più ricorrenti."
    images:
      LEFT_GRAPH: outputs/figures/dark/heuristics/heuristics_distribution.png
      RIGHT_GRAPH: outputs/figures/dark/heuristics/heuristics_by_category.png

  - template_id: table_large
    fields:
      TABLE_TITLE: "Risultati statistici users time"
      TABLE_FOOTNOTE: "Confronto statistico sui tempi osservati nei task."
    table:
      placeholder: TABLE_MAIN
      source: outputs/tables/users_time_stat_tests.csv

  - template_id: findings
    fields:
      FINDING_1: "Deliveroo e Glovo mostrano punti di forza diversi lungo il percorso utente."
      FINDING_2: "I task critici emergono combinando tempi, successo e richieste di aiuto."
      FINDING_3: "Le euristiche aiutano a prioritizzare gli interventi di redesign."
      FINDING_4: "Le conclusioni vanno lette insieme alla dimensione del campione."
    images:
      MINI_GRAPH: outputs/figures/dark/heuristics/heuristics_distribution.png

  - template_id: final_verdict
    fields:
      FINAL_TITLE: "Sintesi finale"
      STRENGTH 1: "Percorso utente competitivo"
      STRENGTH 2: "Buona riconoscibilita visiva"
      WEAKNESS: "criticità da verificare nei task più lunghi"
      WINNER_LABEL: "Lettura comparativa, non verdetto automatico"
    images:
      SUMMARY_GRAPH: outputs/figures/dark/questionnaire/ueq_scales.png
